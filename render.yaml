databases:
  - name: ethereal-aperture-db
    plan: free
    region: oregon
    postgresMajorVersion: 16
    databaseName: ethereal_aperture
    user: ea

services:
  - type: web
    name: ethereal-aperture
    runtime: node
    plan: starter
    region: oregon
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    startCommand: HOST=0.0.0.0 npm run start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: ethereal-aperture-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
